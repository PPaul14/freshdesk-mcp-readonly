[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshdesk-mcp"
version = "0.1.0"
description = "Read-only MCP connector that lets an AI agent read Freshdesk tickets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "requests>=2.31",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle errors + pyflakes (ruff's defaults), I: import sorting,
# UP: modern Python syntax, B: common bug patterns (bugbear).
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
